<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mineiro FF - Aim Control</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-main: #050505;
            --bg-panel: #0e0b0d;
            --border-color: #2a151d;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-red: #ff003c;
            --accent-red-glow: rgba(255, 0, 60, 0.4);
            --accent-green: #00ff66;
            --accent-yellow: #ffcc00;
            --font-family: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: var(--text-main); display: flex; justify-content: center; padding: 10px; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; background-color: var(--bg-main); padding-bottom: 70px; position: relative; overflow-y: auto; height: 100%; }
        
        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .top-bar .icon { font-size: 24px; color: #fff; cursor: pointer; }

        /* Painéis */
        .panel { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: inset 0 0 20px rgba(255, 0, 60, 0.03), 0 0 15px rgba(255, 0, 60, 0.05); position: relative; overflow: hidden; }
        .panel::after { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: var(--accent-red); filter: blur(80px); opacity: 0.1; border-radius: 50%; pointer-events: none; }

        /* Header */
        .header-logo { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; z-index: 2; }
        .logo-box { width: 50px; height: 50px; background: #0a0000; border: 2px solid var(--accent-red); border-radius: 12px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px var(--accent-red-glow); }
        .logo-box svg { width: 28px; height: 28px; fill: var(--accent-red); }
        .title-group h1 { font-size: 20px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        .title-group h1 span { color: var(--accent-red); }
        .title-group p { font-size: 9px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

        /* Badges */
        .status-badges { display: flex; gap: 10px; z-index: 2; }
        .badge { border: 1px solid var(--border-color); background: #000; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .badge.online { color: var(--accent-green); border-color: rgba(0, 255, 102, 0.2); }
        .badge.online .dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 5px var(--accent-green); }
        .badge.fps span { color: var(--accent-red); }
        .badge.ping span { color: var(--accent-yellow); }

        /* Controles */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,0,60,0.15); }
        .section-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
        .section-title svg { width: 18px; height: 18px; fill: var(--accent-red); }
        .section-subtitle { font-size: 10px; color: #555; font-weight: 600; }

        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .control-label { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: #ddd; }
        .control-label svg { width: 14px; height: 14px; fill: var(--accent-red); }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1a1a1a; transition: .3s; border-radius: 24px; border: 1px solid #333; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-red); border-color: var(--accent-red); box-shadow: 0 0 10px var(--accent-red-glow); }
        input:checked + .slider:before { transform: translateX(20px); }

        .slider-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .range-value { font-size: 11px; font-weight: 700; color: var(--accent-red); min-width: 35px; text-align: right; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #222; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { height: 14px; width: 14px; border-radius: 50%; background: var(--accent-red); margin-top: -5px; box-shadow: 0 0 10px var(--accent-red); }

        /* Barra Inferior */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #111; z-index: 100; max-width: 420px; left: 50%; transform: translateX(-50%); }
        .bottom-left-text { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #888; }
        .bottom-left-text svg { width: 14px; height: 14px; fill: var(--accent-yellow); }
        .bottom-icons { display: flex; gap: 15px; align-items: center; }
        .bottom-icons svg { width: 20px; height: 20px; fill: #555; }
        .bottom-icons .active svg { fill: var(--accent-red); }

        /* Canvas */
        #crosshair-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.8; }

        /* BOTÃO FLUTUANTE (HOLD TO AIM) */
        .hold-btn {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 60, 0.1);
            border: 2px solid var(--accent-red);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: var(--accent-red);
            font-weight: 800;
            font-size: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.2);
            transition: all 0.1s;
            user-select: none;
            cursor: pointer;
        }
        .hold-btn:active, .hold-btn.active {
            background: var(--accent-red);
            color: #fff;
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="crosshair-canvas"></canvas>

    <!-- BOTÃO DE SEGURAR PARA MIRAR -->
    <div class="hold-btn" id="btn-hold">SEGURE<br>P/ MIRAR</div>

    <div class="app-container">
        <div class="top-bar">
            <div class="icon" onclick="alert('Segure o botão vermelho no canto da tela para ativar a mira!')">&#10094;</div>
            <div class="icon">&#8942;</div>
        </div>

        <div class="panel">
            <div class="header-logo">
                <div class="logo-box"><svg viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg></div>
                <div class="title-group"><h1>MINEIRO <span>FF</span></h1><p>PRECISION AIM & PERFORMANCE UTILITY</p></div>
            </div>
            <div class="status-badges">
                <div class="badge online"><div class="dot"></div> ENGINE ONLINE</div>
                <div class="badge fps">FPS: <span id="fps-val">60</span></div>
                <div class="badge ping">PING: <span>22ms</span></div>
            </div>
        </div>

        <div class="panel">
            <div class="section-header">
                <div class="section-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#ff003c" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="4" fill="#ff003c"/></svg>STABILIZER CONTROLS</div>
                <div class="section-subtitle">CONFIG V2.4</div>
            </div>

            <!-- CHAVE MESTRA (Desligada por padrão) -->
            <div class="control-row">
                <div class="control-label"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>AIM ASSISTANCE</div>
                <label class="switch"><input type="checkbox" id="cfg-enabled"><span class="slider"></span></label>
            </div>
            <div class="slider-container">
                <input type="range" id="cfg-pullStrength" min="0.1" max="3.0" step="0.1" value="1.0">
                <div class="range-value" id="val-pullStrength">1.0</div>
            </div>

            <!-- SENSI / BOOST VERTICAL (Desligada por padrão) -->
            <div class="control-row">
                <div class="control-label"><svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>SENSI BOOST (Y)</div>
                <label class="switch"><input type="checkbox" id="cfg-boost-enabled"><span class="slider"></span></label>
            </div>
            <div class="slider-container">
                <input type="range" id="cfg-verticalBoost" min="1.0" max="4.0" step="0.1" value="1.6">
                <div class="range-value" id="val-verticalBoost" style="color: var(--accent-yellow);">x1.6</div>
            </div>

            <!-- SMOOTHING (Desligado por padrão) -->
            <div class="control-row">
                <div class="control-label"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>SMOOTHING / ANTI-JITTER</div>
                <label class="switch"><input type="checkbox" id="cfg-smooth-enabled"><span class="slider"></span></label>
            </div>
            <div class="slider-container">
                <input type="range" id="cfg-smoothing" min="0.0" max="0.99" step="0.01" value="0.75">
                <div class="range-value" id="val-smoothing">0.75</div>
            </div>
        </div>
        
        <div class="panel">
            <div class="section-header">
                <div class="section-title" style="color:#fff;"><svg viewBox="0 0 24 24" style="fill:#ff003c;"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z"/></svg>THEME & EFFECTS</div>
            </div>
            <div class="control-label" style="font-size: 10px; margin-bottom: 15px; color:#aaa;">COLOR ACCENT PRESETS</div>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <div style="flex:1; height:35px; border-radius:8px; background:#ff0044; box-shadow: 0 0 10px rgba(255,0,68,0.3);"></div>
                <div style="flex:1; height:35px; border-radius:8px; background:#ff6600;"></div>
                <div style="flex:1; height:35px; border-radius:8px; background:#9933ff;"></div>
                <div style="flex:1; height:35px; border-radius:8px; background:#00cc66;"></div>
                <div style="flex:1; height:35px; border-radius:8px; background:#00ccff;"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="bottom-left-text"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>SYNTHESIZED UI SOUNDS</div>
            <div class="bottom-icons">
                <div class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#ff003c" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="#ff003c"/></svg></div>
                <div><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div>
                <div><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  CONVERSÃO DO C++ (HeadshotAim.hpp) PARA JAVASCRIPT
        // ============================================================
        
        const AimConfig = {
            enabled: false, // MUDOU AQUI: Começa desativado
            pullStrength: 1.0,
            verticalBoost: 1.6,
            horizontalDamp: 0.35,
            acceleration: 25.0,
            maxSpeed: 1200.0,
            responseTime: 0.05,
            snapRadius: 12.0,
            lockRadius: 3.0,
            smoothing: 0.75,
            deadZone: 0.6,
            jitterKill: 0.9,
            headOffset: -2.0,
            neckOffset: 2.0,
            crosshairSize: 9.0,
            crosshairGap: 4.0,
            crosshairThick: 1.6,
            dotSize: 2.0
        };

        let state = {
            curX: window.innerWidth / 2, curY: window.innerHeight / 2,
            velX: 0.0, velY: 0.0,
            prevTargetX: 0.0, prevTargetY: 0.0,
            initialized: false,
            locked: false,
            targetX: window.innerWidth / 2, targetY: window.innerHeight / 2,
            rawAimX: window.innerWidth / 2, rawAimY: window.innerHeight / 2
        };

        let isHoldingTrigger = false; // NOVO: Estado do botão de segurar

        const canvas = document.getElementById('crosshair-canvas');
        const ctx = canvas.getContext('2d');
        const btnHold = document.getElementById('btn-hold');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const TARGET_HEAD_Y = window.innerHeight / 2 - 30; 
        const TARGET_NECK_Y = window.innerHeight / 2 + 20; 

        function updateAim(dt) {
            // A MIRA SÓ FUNCIONA SE O SWITCH ESTIVER ATIVADO E O BOTÃO ESTIVER PRESSIONADO
            if (!AimConfig.enabled || !isHoldingTrigger || dt <= 0) {
                // Se não estiver ativo, a mira apenas segue o dedo normalmente (sem puxar)
                if (!isHoldingTrigger) {
                    state.curX += (state.targetX - state.curX) * 0.5;
                    state.curY += (state.targetY - state.curY) * 0.5;
                    state.initialized = false; // Reseta ao soltar
                }
                return;
            }

            let tx = (window.innerWidth / 2);
            let ty = TARGET_HEAD_Y + AimConfig.headOffset;

            let upper = ty + AimConfig.headOffset;
            let lower = TARGET_NECK_Y + AimConfig.neckOffset;
            if (upper > lower) { let temp = upper; upper = lower; lower = temp; }

            if (!state.initialized) {
                state.curX = state.rawAimX;
                state.curY = state.rawAimY;
                state.prevTargetX = tx;
                state.prevTargetY = ty;
                state.initialized = true;
            }

            let dx = tx - state.curX;
            let dy = ty - state.curY;

            let pullX = dx * AimConfig.pullStrength * AimConfig.horizontalDamp;
            let pullY = dy * AimConfig.pullStrength * AimConfig.verticalBoost;

            if (Math.abs(pullX) < AimConfig.deadZone) pullX = 0.0;
            if (Math.abs(pullY) < AimConfig.deadZone) pullY = 0.0;

            state.velX += pullX * AimConfig.acceleration * dt;
            state.velY += pullY * AimConfig.acceleration * dt;

            state.velX *= (1.0 - AimConfig.smoothing * AimConfig.jitterKill);
            state.velY *= (1.0 - AimConfig.smoothing * AimConfig.jitterKill);

            let speed = Math.sqrt(state.velX * state.velX + state.velY * state.velY);
            if (speed > AimConfig.maxSpeed) {
                let k = AimConfig.maxSpeed / speed;
                state.velX *= k;
                state.velY *= k;
            }

            state.curX += state.velX * dt;
            state.curY += state.velY * dt;

            if (Math.abs(state.curX - tx) < AimConfig.snapRadius && Math.abs(state.curY - ty) < AimConfig.snapRadius) {
                let snapT = Math.min(Math.max(AimConfig.responseTime * 20.0 * dt, 0.0), 1.0);
                state.curX += (tx - state.curX) * snapT;
                state.curY += (ty - state.curY) * snapT;
            }

            if (state.curY < upper) { state.curY = upper; state.velY = 0.0; }
            if (state.curY > lower) { state.curY = lower; state.velY = 0.0; }

            let maxLateral = Math.abs(dx) * 0.15 + 4.0;
            if (Math.abs(state.curX - tx) > maxLateral) {
                state.curX = tx + (state.curX > tx ? maxLateral : -maxLateral);
                state.velX *= 0.4;
            }

            state.locked = (Math.abs(state.curX - tx) < AimConfig.lockRadius && Math.abs(state.curY - ty) < AimConfig.lockRadius);
            if (state.locked) {
                state.curX = tx;
                state.curY = ty;
                state.velX = 0; state.velY = 0;
            }

            let dirX = tx - state.prevTargetX;
            if ((dirX > 0 && state.velX < 0) || (dirX < 0 && state.velX > 0)) {
                state.velX *= 0.2;
            }
            state.prevTargetX = tx;
            state.prevTargetY = ty;
        }

        function drawAim() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Alvo virtual
            ctx.beginPath();
            ctx.arc(window.innerWidth / 2, TARGET_HEAD_Y, 30, 0, Math.PI * 2);
            ctx.fillStyle = isHoldingTrigger ? 'rgba(0, 255, 80, 0.1)' : 'rgba(255, 0, 60, 0.1)';
            ctx.fill();
            ctx.strokeStyle = isHoldingTrigger ? 'rgba(0, 255, 80, 0.4)' : 'rgba(255, 0, 60, 0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (!state.initialized) return;

            let color = state.locked ? "#00ff50" : (Math.abs(state.velY) > 50 ? "#ffc800" : "#ffffff");
            if (!isHoldingTrigger) color = "#555"; // Cinza quando solto
            
            let cx = state.curX, cy = state.curY;
            let g = AimConfig.crosshairGap;
            let s = AimConfig.crosshairSize;

            const drawLine = (x1, y1, x2, y2) => {
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = AimConfig.crosshairThick + 1.5; ctx.stroke();
                
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                ctx.strokeStyle = color; ctx.lineWidth = AimConfig.crosshairThick; ctx.stroke();
            };

            drawLine(cx, cy - g, cx, cy - g - s);
            drawLine(cx, cy + g, cx, cy + g + s);
            drawLine(cx - g, cy, cx - g - s, cy);
            drawLine(cx + g, cy, cx + g + s, cy);

            if (AimConfig.dotSize > 0) {
                ctx.beginPath(); ctx.arc(cx, cy, AimConfig.dotSize, 0, Math.PI * 2);
                ctx.fillStyle = color; ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 1; ctx.stroke();
            }
        }

        let lastTime = performance.now();
        let fpsTimer = 0, frames = 0;

        function loop(time) {
            let dt = (time - lastTime) / 1000;
            lastTime = t
